version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: microjob-postgres
    restart: always
    environment:
      POSTGRES_USER: microjob
      POSTGRES_PASSWORD: microjobpassword2026
      POSTGRES_DB: microjob_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microjob -d microjob_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: microjob-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: microjob-backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://microjob:microjobpassword2026@postgres:5432/microjob_db?schema=public"
      JWT_SECRET: "super-secret-microjob-key-2026"
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: microjob-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
